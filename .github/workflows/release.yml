name: "Release"

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon (Intel Macs are no longer released) and Windows x64.
        include:
          - platform: "macos-26" # M1 and later. macOS 26 for the Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          # No --target for Windows x64: it is the host, and the extra
          # "x86_64-pc-windows-msvc\" in the target path pushes whisper.cpp's
          # MSBuild files past MAX_PATH. build.yml expects this layout.
          # NSIS only: WiX (MSI) cannot encode "Fısıltı" in its codepage, and
          # the updater uses the NSIS setup.exe anyway.
          - platform: "windows-latest"
            args: "--bundles nsis"
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "fisilti"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  # One updater manifest for every platform, written once all builds have
  # uploaded their signatures. tauri-action skips latest.json when the asset
  # names are rewritten ("Fısıltı.app.tar.gz.sig" vs the uploaded
  # "Fisilti_….sig"), so it is built from the uploaded signatures. Without it
  # installed apps never update.
  updater-manifest:
    permissions:
      contents: write
    needs: [create-release, publish-tauri]
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Upload updater manifest (latest.json)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.create-release.outputs.version }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          platforms='{}'
          add_platform() { # <platform key> <signature asset suffix>
            local sig_name
            sig_name=$(printf '%s\n' "$assets" | grep -- "$2\$" | head -1 || true)
            [ -n "$sig_name" ] || { echo "no $1 updater signature in $TAG"; return 0; }
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$sig_name" -O "$1.sig" --clobber
            platforms=$(jq --arg key "$1" --arg sig "$(cat "$1.sig")" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${sig_name%.sig}" \
              '. + {($key): {signature: $sig, url: $url}}' <<<"$platforms")
          }
          add_platform darwin-aarch64 '.app.tar.gz.sig'
          add_platform windows-x86_64 '-setup.exe.sig'
          [ "$platforms" != '{}' ] || { echo "no updater signatures in $TAG"; exit 1; }
          jq -n --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $v, pub_date: $date, platforms: $platforms}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json -R "$GITHUB_REPOSITORY" --clobber
