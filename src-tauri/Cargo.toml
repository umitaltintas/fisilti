[package]
name = "fisilti"
version = "0.2.5"
description = "Fısıltı — local dictation & AI meeting notes"
authors = ["Ümit Altıntaş", "cjpais"]
edition = "2021"
license = "MIT"
default-run = "fisilti"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# No debug info for dependencies: it is most of what the compiler and linker
# write in a dev build, and nobody steps through tauri or tokio. Our own crate
# keeps full debug info.
[profile.dev.package."*"]
debug = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fisilti_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# [[bin]]
# name = "cli"
# path = "src/audio_toolkit/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
once_cell = "1"
tauri = { version = "2.10.2", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
  "devtools",
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "2.3"
tauri-plugin-fs = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16.0"
anyhow = "1.0.95"
rubato = "0.16.2"
hound = "3.5.1"
# Decodes imported recordings (phone voice memos, conference recordings).
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "alac", "isomp4", "mp3", "flac", "vorbis", "ogg", "wav", "pcm", "adpcm", "aiff", "caf", "mkv"] }
log = "0.4.25"
env_filter = "0.1.0"
tokio = { version = "1.43.0", features = ["macros", "time", "sync"] }
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git" }
# rustls (ring provider, installed in `run`) instead of native-tls: the updater
# already needs rustls, so this keeps a single TLS stack and a single reqwest.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "charset",
  "http2",
  "system-proxy",
  "json",
  "stream",
  "blocking",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64 = "0.22"
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
transcribe-rs = { path = "vendor/transcribe-rs", features = ["whisper-cpp", "onnx"] }
# Native keyboard hooks (the crate is published as `handy-keys`).
hotkeys = { package = "handy-keys", version = "0.2.4" }
clap = { version = "4", features = ["derive"] }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.6"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
mp3lame-encoder = "0.2.5"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"
tauri-plugin-updater = "2.10.0"

[target.'cfg(windows)'.dependencies]
transcribe-rs = { path = "vendor/transcribe-rs", features = ["whisper-vulkan", "ort-directml"] }
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  # Meeting mode: endpoint form factor (echo duck) and process names for
  # window titles (meeting naming).
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Threading",
] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
transcribe-rs = { path = "vendor/transcribe-rs", features = ["whisper-metal"] }
# Meeting mode: CoreAudio system-audio tap (Step 1). Isolated from dictation flow.
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
# Lock-free ring buffer between the CoreAudio IO-proc and the capture stream.
ringbuf = "0.4.8"
# Meeting naming: EventKit lookup of the ongoing calendar event so sessions can
# be named after the real meeting (opt-in `meeting_calendar_names` setting).
objc2 = "0.6"
objc2-event-kit = { version = "0.3", features = [
  "EKEventStore",
  "EKEvent",
  "EKCalendar",
  "EKCalendarItem",
  "EKObject",
  "EKTypes",
  "block2",
] }
objc2-foundation = { version = "0.3", features = [
  "NSDate",
  "NSArray",
  "NSString",
  "NSError",
  "NSPredicate",
  "NSObjCRuntime",
] }
block2 = "0.6"

# Meeting mode capture (macOS CoreAudio tap / Linux PipeWire-Pulse monitor /
# Windows WASAPI loopback).
[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
futures-channel = "0.3.31"
# EBU R128 loudness measurement for mic normalization in the meeting capture loop.
ebur128 = "0.1.10"

[target.'cfg(target_os = "linux")'.dependencies]
# Meeting mode on Linux: system-audio capture from the default sink's monitor,
# output-route detection and mic-using app detection, via the PulseAudio API
# (served by pipewire-pulse on modern distros).
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
# Meeting naming on KDE: ask KWin for window captions over D-Bus. Already in
# the tree via tauri-plugin-opener / single-instance.
zbus = "5"
enumflags2 = "0.7"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"
transcribe-rs = { path = "vendor/transcribe-rs", features = ["whisper-vulkan"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# Thin LTO with parallel codegen: most of the release build time used to be
# one single-threaded fat-LTO step. The hot paths (whisper.cpp, onnxruntime)
# are C/C++ and unaffected.
lto = "thin"
strip = true
panic = "unwind"
